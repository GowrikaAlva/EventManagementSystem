<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valora</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #e53e3e, #f6ad55);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .header-info p {
      font-size: 11px;
      color: #555;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #48bb78;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #48bb78;
      box-shadow: 0 0 6px #48bb78;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    /* ── Backend status bar ── */
    #backend-status {
      padding: 7px 18px;
      font-size: 11px;
      background: #161616;
      border-bottom: 1px solid #1e1e1e;
      color: #666;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #backend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }

    #backend-dot.online  { background: #48bb78; box-shadow: 0 0 5px #48bb78; }
    #backend-dot.offline { background: #e53e3e; }

    /* ── Section ── */
    .section {
      padding: 13px 18px;
      border-bottom: 1px solid #1a1a1a;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #444;
      margin-bottom: 10px;
    }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
    }

    .t-icon { font-size: 14px; width: 20px; text-align: center; }

    /* Switch */
    .switch {
      position: relative;
      width: 34px;
      height: 19px;
    }

    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }

    .slider {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      border-radius: 19px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      left: 3px;
      top: 3px;
      background: #666;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .switch input:checked + .slider            { background: rgba(229,62,62,0.3); }
    .switch input:checked + .slider::before   { transform: translateX(15px); background: #e53e3e; }

    /* ── Domain section ── */
    .domain-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    input[type="text"] {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input[type="text"]::placeholder { color: #3a3a3a; }
    input[type="text"]:focus        { border-color: #e53e3e; }

    .add-btn {
      background: #e53e3e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }

    .add-btn:hover { background: #c53030; }

    #domain-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .domain-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(229,62,62,0.1);
      border: 1px solid rgba(229,62,62,0.25);
      color: #fc8181;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-family: "SF Mono", monospace;
    }

    .domain-chip button {
      background: none;
      border: none;
      color: #e57373;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    /* ── Footer ── */
    .footer {
      padding: 10px 18px;
      text-align: center;
      font-size: 10px;
      color: #2e2e2e;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">⚠</div>
    <div class="header-info">
      <h1>Valora</h1>
      <p>Sensitive data guard</p>
    </div>
    <div class="status">
      <div class="dot"></div> Active
    </div>
  </div>

  <!-- Backend status indicator -->
  <div id="backend-status">
    <div id="backend-dot"></div>
    <span id="backend-label">Checking backend…</span>
  </div>

  <!-- Detection toggles -->
  <div class="section">
    <div class="section-label">Detection categories</div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon">✉️</span> Emails</span>
      <label class="switch">
        <input type="checkbox" id="toggle-email" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon">🔑</span> API Keys</span>
      <label class="switch">
        <input type="checkbox" id="toggle-apikey" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon">💳</span> Credit Cards</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cc" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon">📞</span> Phone Numbers</span>
      <label class="switch">
        <input type="checkbox" id="toggle-phone" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon">🪪</span> SSN</span>
      <label class="switch">
        <input type="checkbox" id="toggle-ssn" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Company domains -->
  <div class="section">
    <div class="section-label">Company domains</div>
    <div class="domain-row">
      <input type="text" id="domain-input" placeholder="@yourcompany.com" />
      <button class="add-btn" id="add-domain-btn">Add</button>
    </div>
    <div id="domain-list"></div>
  </div>

  <!-- Footer -->
  <div class="footer">Valora v2 · All detection runs locally · No data leaves your browser</div>

  <script src="popup.js"></script>
</body>
</html>
