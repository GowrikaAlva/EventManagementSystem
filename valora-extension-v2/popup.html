<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valora</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: radial-gradient(1200px 900px at 12% 0%, rgba(37,230,217,.05), transparent 55%), linear-gradient(180deg, #070A0F, #0B1020);
      color: #EAF0FF;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: 0.2px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(7,10,15,.65);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo img {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.55));
    }

    .header-info h1 {
      font-size: 15px;
      font-weight: 700;
      color: #EAF0FF;
      letter-spacing: -0.01em;
    }

    .header-info p {
      font-size: 11px;
      color: rgba(234,240,255,.52);
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #25E6D9;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #25E6D9;
      box-shadow: 0 0 6px rgba(37,230,217,.6);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    /* ── Backend status bar ── */
    #backend-status {
      padding: 7px 18px;
      font-size: 11px;
      background: rgba(255,255,255,.04);
      border-bottom: 1px solid rgba(255,255,255,.10);
      color: rgba(234,240,255,.68);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #backend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }

    #backend-dot.online  { background: #25E6D9; box-shadow: 0 0 5px rgba(37,230,217,.6); }
    #backend-dot.offline { background: #666; }

    /* ── Section ── */
    .section {
      margin: 12px 18px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.02);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: rgba(234,240,255,.52);
      margin-bottom: 10px;
    }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
    }

    /* Switch */
    .switch {
      position: relative;
      width: 34px;
      height: 19px;
    }

    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }

    .slider {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      border-radius: 19px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      left: 3px;
      top: 3px;
      background: #666;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .switch input:checked + .slider            { background: rgba(37,230,217,.2); }
    .switch input:checked + .slider::before   { transform: translateX(15px); background: #25E6D9; }

    /* ── Domain section ── */
    .domain-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      height: 38px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      color: #EAF0FF;
      font-size: 12px;
      padding: 0 12px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder { color: rgba(234,240,255,.52); }
    input[type="text"]:focus, input[type="password"]:focus        { border-color: rgba(37,230,217,.55); box-shadow: 0 0 0 4px rgba(37,230,217,.14); }

    .add-btn {
      background: linear-gradient(180deg, rgba(37,230,217,.26), rgba(255,255,255,.06));
      color: #EAF0FF;
      border: 1px solid rgba(37,230,217,.45);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .add-btn:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.08); }

    #domain-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .domain-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(37,230,217,.10);
      border: 1px solid rgba(37,230,217,.30);
      color: #EAF0FF;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: inherit;
    }

    .domain-chip button {
      background: none;
      border: none;
      color: #25E6D9;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    /* ── Footer ── */
    .footer {
      padding: 10px 18px;
      text-align: center;
      font-size: 10px;
      color: rgba(234,240,255,.52);
    }

    /* ── Login View ── */
    #login-view {
      display: flex;
      flex-direction: column;
      padding: 20px 18px;
      gap: 12px;
    }

    #login-view h2 {
      font-size: 14px;
      color: #EAF0FF;
      margin-bottom: 5px;
    }

    .input-grp {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-grp label {
      font-size: 11px;
      color: rgba(234,240,255,.68);
    }

    .login-btn {
      margin-top: 10px;
      height: 42px;
      background: linear-gradient(180deg, rgba(37,230,217,.26), rgba(255,255,255,.06));
      color: #EAF0FF;
      border: 1px solid rgba(37,230,217,.45);
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }

    .login-btn:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.08); }

    #login-error {
      color: #94A3B8;
      font-size: 11px;
      display: none;
    }

    /* ── Hide/Show classes ── */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Login View -->
  <div id="login-view">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
      <div class="logo"><img src="icons/valora-logo.svg" alt="Valora" /></div>
      <h1 style="font-size:16px;">Valora Security</h1>
    </div>
    
    <h2>Employee Login</h2>
    <div id="login-error"></div>
    
    <div class="input-grp" id="grp-email">
      <label>Email</label>
      <input type="text" id="login-email" placeholder="you@company.com" />
    </div>

    <div class="input-grp" id="grp-password" class="hidden">
      <label>Password</label>
      <input type="password" id="login-password" />
    </div>

    <button class="login-btn" id="btn-login-next">Next</button>
    <button class="login-btn hidden" id="btn-login-submit">Login</button>
  </div>

  <!-- Main View -->
  <div id="main-view" class="hidden">

  <!-- Header -->
  <div class="header">
    <div class="logo"><img src="icons/valora-logo.svg" alt="Valora" /></div>
    <div class="header-info">
      <h1>Valora</h1>
      <p>Sensitive data guard</p>
    </div>
    <div class="status">
      <div class="dot"></div> Active
    </div>
  </div>

  <!-- Backend status indicator -->
  <div id="backend-status">
    <div id="backend-dot"></div>
    <span id="backend-label">Checking backend…</span>
  </div>

  <!-- Sensitive Keywords -->
  <div class="section">
    <div class="section-label">Sensitive Keywords</div>
    <div class="domain-row">
      <input type="text" id="keyword-input" placeholder="Enter keyword…" />
      <button class="add-btn" id="add-keyword-btn">Add</button>
    </div>
    <div id="keyword-list"></div>
  </div>

  <!-- Detection toggles -->
  <div class="section">
    <div class="section-label">Detection categories</div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon"></span>Email</span>
      <label class="switch">
        <input type="checkbox" id="toggle-email" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon"></span>API Keys</span>
      <label class="switch">
        <input type="checkbox" id="toggle-apikey" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon"></span>Credit Cards</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cc" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon"></span>Phone Numbers</span>
      <label class="switch">
        <input type="checkbox" id="toggle-phone" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="t-icon"></span>SSN Record</span>
      <label class="switch">
        <input type="checkbox" id="toggle-ssn" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>



  <!-- Footer -->
  <div class="footer">Valora v2 · All detection runs locally · No data leaves your browser<br>
    <a href="#" id="btn-logout" style="color: #666; text-decoration: underline; margin-top: 5px; display: inline-block;">Logout</a>
  </div>

  </div> <!-- End Main View -->

  <script src="popup.js"></script>
</body>
</html>
